name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build and test ETHER
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Prepare public APK download
        run: cp app/build/outputs/apk/debug/app-debug.apk ETHER.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETHER-apk
          path: ETHER.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as a public GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ether-build-${{ github.run_number }}
          name: ETHER build ${{ github.run_number }}
          body: |
            Automated ETHER Android debug build.
            This is a testing APK, not a production-signed release.
          files: ETHER.apk
          make_latest: true
